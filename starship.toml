"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
command_timeout = 1000

# ألوان المقاطع:
#   يوزر #3466c2 | مسار #2b4170 | git #52407f | وقت #24493f

format = """
[\ue0b6](fg:#3466c2)\
$username\
[\ue0b0](fg:#3466c2 bg:#2b4170)\
$directory\
$git_branch\
$git_status\
${custom.git_end}\
${custom.nogit_end}\
$time\
[\ue0b4](fg:#24493f) \
$python\
$nodejs\
$rust\
$golang\
$java\
$kotlin\
$php\
$c\
$cpp\
$dotnet\
$ruby\
$swift\
$dart\
$lua\
$perl\
$scala\
$elixir\
$haskell\
$zig\
$julia\
$crystal\
$elm\
$erlang\
$terraform\
$nix_shell\
$docker_context\
$kubernetes\
$aws\
$package\
$cmd_duration\
$jobs
$character"""

[username]
show_always = true
style_user = "bold fg:#ffffff bg:#3466c2"
style_root = "bold fg:#ffffff bg:#e01b24"
format = "[ \uf30a $user ]($style)"

[directory]
style = "fg:#e8e8e8 bg:#2b4170"
read_only = " \uf023"
read_only_style = "fg:#ff6b6b bg:#2b4170"
home_symbol = "\uf015 ~"
truncation_length = 3
truncation_symbol = "…/"
format = "[ $path]($style)[$read_only]($read_only_style)[ ]($style)"

# ---------- git (مبسط) ----------
# السهم قبل الفرع جوه الـ format عشان يظهر بس جوه مشروع git
[git_branch]
symbol = "\ue0a0 "
style = "fg:#d2a8ff bg:#52407f"
format = "[\ue0b0](fg:#2b4170 bg:#52407f)[ $symbol$branch ]($style)"

[git_status]
style = "fg:#d2a8ff bg:#52407f"
format = "([$all_status$ahead_behind ]($style))"
conflicted = "="
ahead = "⇡"
behind = "⇣"
diverged = "⇕"
untracked = "?"
stashed = "$"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

[git_state]
disabled = true

[git_metrics]
disabled = true

# سهم النهاية: لو جوه git يبقى من الأخضر للوردي، ولو لأ يبقى من البرتقالي للوردي
[custom.git_end]
when = "git rev-parse --is-inside-work-tree"
command = "echo 1"
format = "[\ue0b0](fg:#52407f bg:#24493f)"
shell = ["sh"]

[custom.nogit_end]
when = "! git rev-parse --is-inside-work-tree"
command = "echo 1"
format = "[\ue0b0](fg:#2b4170 bg:#24493f)"
shell = ["sh"]

[time]
disabled = false
time_format = "%H:%M"
style = "fg:#7ee787 bg:#24493f"
format = "[ \uf017 $time ]($style)"

# ---------- اللغات (بتظهر بعد المقاطع، بس لما تكون جوه مشروع بيستخدمها) ----------
